<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <header th:fragment="header" class="bg-white border-bottom py-2 px-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <span class="badge badge-primary-soft me-2 px-2 py-1">
                <i class="bi bi-building me-1"></i> <span th:text="${companyName}">OmniFlow Global</span>
            </span>
            <span class="text-muted small d-none d-md-inline" th:text="${appTagline}">Enterprise Logistics ERP</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/verify}" class="btn btn-sm btn-outline-success">
                <i class="bi bi-qr-code-scan me-1"></i> Public QR Verify
            </a>
            <a th:href="@{/analytics/predictive}" class="btn btn-sm btn-warning text-dark fw-semibold">
                <i class="bi bi-lightning-charge-fill me-1"></i> AI Risk Matrix
            </a>
            <div class="text-muted small">
                <i class="bi bi-clock me-1"></i> <span id="live-time"></span>
            </div>
        </div>
    </header>
</body>
</html>
