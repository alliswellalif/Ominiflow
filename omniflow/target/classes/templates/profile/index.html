<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${'User Profile - ' + appName}">Profile - OmniFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body th:class="${primaryTheme != null ? primaryTheme : 'theme-indigo'}">

    <div class="d-flex min-vh-100">
        <div th:replace="~{layout/sidebar :: sidebar('profile')}"></div>

        <div class="flex-grow-1 d-flex flex-column min-vh-100 overflow-hidden">
            <header th:replace="~{layout/header :: header}"></header>

            <div class="container-fluid px-4 pt-3">
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <i class="bi bi-exclamation-octagon-fill me-2"></i> <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>

            <main class="flex-grow-1 container-fluid px-4 py-3">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h3 class="fw-bold mb-1">User Account &amp; Security Credentials</h3>
                        <p class="text-muted small mb-0">Update your profile display name, email, or change your password.</p>
                    </div>
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Dashboard
                    </a>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-8">
                        <div class="card p-4">
                            <form th:action="@{/profile/update}" method="post">
                                
                                <div class="d-flex align-items-center mb-4 p-3 bg-light rounded-3">
                                    <div class="bg-primary text-white rounded-circle p-3 me-3 d-flex align-items-center justify-content-center" style="width: 54px; height: 54px;">
                                        <i class="bi bi-person-fill fs-3"></i>
                                    </div>
                                    <div>
                                        <h5 class="fw-bold mb-0 text-dark" th:text="${user.fullName}">Admin Name</h5>
                                        <div class="text-muted small">Username: <strong th:text="${user.username}">admin</strong> | Role: <span class="badge bg-primary" th:text="${user.role}">ROLE_ADMIN</span></div>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-semibold">Full Display Name *</label>
                                        <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-semibold">Registered Email *</label>
                                        <input type="email" name="email" class="form-control" th:value="${user.email}" required>
                                    </div>
                                </div>

                                <hr class="my-4">
                                <h6 class="fw-bold text-danger mb-3">
                                    <i class="bi bi-shield-lock me-2"></i> Update Password (Optional)
                                </h6>

                                <div class="mb-4">
                                    <label class="form-label small fw-semibold">New Password</label>
                                    <input type="password" name="newPassword" class="form-control" placeholder="Leave empty to keep your existing password" minlength="6">
                                    <small class="text-muted">Must be at least 6 characters. Passwords are securely hashed using BCrypt.</small>
                                </div>

                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="@{/dashboard}" class="btn btn-light border px-4">Cancel</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                                        <i class="bi bi-check2-circle me-1"></i> Save Profile &amp; Password
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </main>

            <div th:replace="~{layout/footer :: footer}"></div>
        </div>
    </div>
</body>
</html>
