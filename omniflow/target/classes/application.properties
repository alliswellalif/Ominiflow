# ===================================================================
# OmniFlow Enterprise - Core Application Configuration
# ===================================================================
spring.application.name=OmniFlow Platform

# Dynamic Port (Supports Cloud Deployments like Render, Railway, AWS, Heroku)
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------
# Primary Database Configuration: MySQL 8.0
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:omniflow_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto-detection & Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Actuator & Telemetry Endpoints
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# File Upload Limits
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
