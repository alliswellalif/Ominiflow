version: '3.8'

services:
  app:
    build: .
    container_name: omniflow_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=omniflow_db
      - DB_USER=omniflow_user
      - DB_PASSWORD=secret_password_123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: omniflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_master_password
      MYSQL_DATABASE: omniflow_db
      MYSQL_USER: omniflow_user
      MYSQL_PASSWORD: secret_password_123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:

