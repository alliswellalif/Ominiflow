<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="footer">
        <footer class="bg-white border-top py-3 px-4 text-center text-muted small d-flex justify-content-between">
            <div>
                &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> 
                <strong th:text="${appName}">OmniFlow</strong>. All rights reserved.
            </div>
            <div>
                Support: <a th:href="'mailto:' + ${companyEmail}" th:text="${companyEmail}">support@omniflow.io</a>
                | <a th:href="@{/verify}" class="text-decoration-none">SHA-256 Ledger</a>
            </div>
        </footer>

        <!-- Bootstrap 5.3 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/main.js}"></script>
        <script>
            function updateLiveTime() {
                const now = new Date();
                const elem = document.getElementById('live-time');
                if (elem) {
                    elem.textContent = now.toLocaleTimeString();
                }
            }
            setInterval(updateLiveTime, 1000);
            updateLiveTime();
        </script>
    </div>
</body>
</html>
