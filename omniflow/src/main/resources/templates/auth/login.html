<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - OmniFlow Enterprise ERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        .demo-chip {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .demo-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="theme-indigo">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card login-card p-4 p-sm-5">
                    
                    <!-- Branding Header -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white p-3 rounded-4 mb-3 shadow">
                            <i class="bi bi-boxes fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1" th:text="${appName}">OmniFlow ERP</h3>
                        <p class="text-muted small" th:text="${appTagline}">Intelligent Supply Chain &amp; Verifiable Inventory</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small d-flex align-items-center">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}"></span>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Username or Staff ID</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" id="username-input" name="username" class="form-control border-start-0" placeholder="e.g. admin" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                                <input type="password" id="password-input" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Authenticate &amp; Launch
                        </button>
                    </form>

                    <!-- 1-Click Demo Accounts -->
                    <div class="border-top pt-3 mt-2">
                        <div class="small fw-semibold text-muted text-center mb-2">
                            <i class="bi bi-magic me-1 text-primary"></i> 1-Click Demo Accounts (Click to Fill):
                        </div>
                        <div class="d-flex flex-column gap-1">
                            <div class="demo-chip p-2 rounded bg-light border d-flex justify-content-between align-items-center small" onclick="fillCreds('admin', 'admin123')">
                                <div><strong class="text-primary">Admin:</strong> <code>admin</code> / <code>admin123</code></div>
                                <span class="badge bg-danger">Full Control</span>
                            </div>
                            <div class="demo-chip p-2 rounded bg-light border d-flex justify-content-between align-items-center small" onclick="fillCreds('manager', 'manager123')">
                                <div><strong class="text-primary">Manager:</strong> <code>manager</code> / <code>manager123</code></div>
                                <span class="badge bg-primary">Logistics</span>
                            </div>
                            <div class="demo-chip p-2 rounded bg-light border d-flex justify-content-between align-items-center small" onclick="fillCreds('staff', 'staff123')">
                                <div><strong class="text-primary">Staff:</strong> <code>staff</code> / <code>staff123</code></div>
                                <span class="badge bg-secondary">Warehouse</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Links -->
                    <div class="text-center mt-4 small">
                        <span class="text-muted">Need a new staff account?</span>
                        <a th:href="@{/register}" class="fw-semibold text-decoration-none">Register</a>
                        <span class="mx-2 text-muted">&bull;</span>
                        <a th:href="@{/verify}" class="text-success text-decoration-none fw-semibold">
                            <i class="bi bi-qr-code-scan"></i> Public Verify
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username-input').value = u;
            document.getElementById('password-input').value = p;
        }
    </script>
</body>
</html>
