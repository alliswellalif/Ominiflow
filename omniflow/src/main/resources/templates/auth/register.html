<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - OmniFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="theme-indigo">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card register-card p-4 p-sm-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white p-3 rounded-4 mb-2 shadow">
                            <i class="bi bi-person-plus-fill fs-3"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">New Staff Registration</h4>
                        <p class="text-muted small">Join the <span th:text="${appName}">OmniFlow</span> operations team</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Full Name</label>
                            <input type="text" name="fullName" class="form-control" placeholder="e.g. Michael Scott" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Corporate Email</label>
                            <input type="email" name="email" class="form-control" placeholder="e.g. michael@company.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Choose a unique username" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3 shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Complete Registration
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        <span class="text-muted">Already have credentials?</span>
                        <a th:href="@{/login}" class="fw-semibold text-decoration-none">Sign In</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
